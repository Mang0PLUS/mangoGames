<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        /* Cyberpunk Base Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #050505; color: #00ffcc; overflow: hidden; height: 100vh; display: flex; }
        
        /* Starfield Canvas */
        #space-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* Sidebar */
        .sidebar { width: 80px; background: rgba(10, 10, 15, 0.8); border-right: 1px solid #ff00ff; display: flex; flex-direction: column; align-items: center; padding: 20px 0; backdrop-filter: blur(10px); transition: width 0.3s; z-index: 10;}
        .sidebar:hover { width: 200px; }
        .sidebar:hover .nav-text { display: inline-block; }
        .nav-btn { background: none; border: none; color: #00ffcc; font-size: 1.5rem; margin: 15px 0; cursor: pointer; display: flex; align-items: center; gap: 15px; width: 100%; padding: 10px 20px; transition: 0.3s; }
        .nav-btn:hover, .nav-btn.active { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; border-left: 3px solid #ff00ff; }
        .nav-text { display: none; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; }

        /* Main Content */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100%; }

        /* Top Bar */
        .top-bar { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); z-index: 10; }
        .title-glow { font-size: 2rem; font-weight: 900; color: transparent; -webkit-text-stroke: 1px #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.5); letter-spacing: 5px; }
        
        /* Action Buttons */
        .actions { display: flex; gap: 15px; }
        .btn { padding: 10px 20px; border: 1px solid; border-radius: 4px; background: rgba(0,0,0,0.5); cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; backdrop-filter: blur(5px); }
        .btn-cloak { color: #ffff00; border-color: #ffff00; }
        .btn-cloak:hover { background: #ffff00; color: #000; box-shadow: 0 0 15px #ffff00; }
        .btn-discord { color: #7289da; border-color: #7289da; }
        .btn-discord:hover { background: #7289da; color: #fff; box-shadow: 0 0 15px #7289da; }
        .btn-github { color: #fff; border-color: #fff; }
        .btn-github:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

        /* Tab Content */
        .tab-content { display: none; padding: 40px; overflow-y: auto; height: 100%; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Grid System */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        .card { height: 250px; background: rgba(0, 0, 0, 0.6); border: 1px solid #00ffcc; position: relative; overflow: hidden; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; text-align: center;}
        .card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,0,255,0.2), transparent); transform: rotate(45deg); transition: 0.5s; }
        .card:hover { transform: scale(1.05) translateY(-10px); box-shadow: 0 0 20px rgba(0,255,204,0.4); border-color: #ff00ff; }
        .card:hover::before { left: 100%; }
        .card h3 { z-index: 1; color: #fff; text-shadow: 2px 2px 0px #ff00ff; font-size: 1.5rem; letter-spacing: 1px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00ffcc; }
    </style>
</head>
<body>

<!-- Warp Speed Canvas -->
<canvas id="space-canvas"></canvas>

<!-- Sidebar Navigation -->
<div class="sidebar">
    <button class="nav-btn active" onclick="switchTab('games')">
        <span>🎮</span><span class="nav-text">Games</span>
    </button>
    <button class="nav-btn" onclick="switchTab('apps')">
        <span>📱</span><span class="nav-text">Apps</span>
    </button>
    <button class="nav-btn" onclick="switchTab('store')">
        <span>🛒</span><span class="nav-text">Store</span>
    </button>
</div>

<!-- Main App Area -->
<div class="main-content">
    
    <!-- Topbar with Actions -->
    <div class="top-bar">
        <div class="title-glow">NEON_NEXUS</div>
        <div class="actions">
            <button class="btn btn-cloak" onclick="cloakSite()">👻 Cloak</button>
            <a href="https://discord.gg/your-invite-link" target="_blank" class="btn btn-discord">💬 Discord</a>
            <button class="btn btn-github" onclick="githubLogin()" id="login-btn">GitHub Login</button>
        </div>
    </div>

    <!-- Games Tab -->
    <div id="games" class="tab-content active">
        <h2 style="margin-bottom: 20px; color: #ff00ff;">> AVAILABLE_GAMES</h2>
        <div class="grid">
            <div class="card"><h3>Retro Drift</h3></div>
            <div class="card"><h3>Cyber Jump</h3></div>
            <div class="card"><h3>Neon Shooter</h3></div>
            <div class="card"><h3>Grid Runner</h3></div>
            <div class="card"><h3>Pixel Smash</h3></div>
            <div class="card"><h3>Void Surfer</h3></div>
        </div>
    </div>

    <!-- Apps Tab -->
    <div id="apps" class="tab-content">
        <h2 style="margin-bottom: 20px; color: #ff00ff;">> UTILITIES</h2>
        <div class="grid">
            <div class="card"><h3>Proxy 1</h3></div>
            <div class="card"><h3>Proxy 2</h3></div>
            <div class="card"><h3>Dev Tools</h3></div>
        </div>
    </div>

    <!-- Store Tab -->
    <div id="store" class="tab-content">
        <h2 style="margin-bottom: 20px; color: #ff00ff;">> THE_STORE</h2>
        <p>Unlock custom cursors, background themes, and exclusive titles here.</p>
    </div>

</div>

<!-- UI & Cloaking Logic -->
<script>
    // Tab Switching
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // About:Blank Cloaking
    function cloakSite() {
        let win = window.open('about:blank', '_blank');
        if (!win) {
            alert("Popup blocker is on! Allow popups to use the cloaker.");
            return;
        }
        let doc = win.document;
        // Make it look like Google Drive in the tab
        doc.write('<title>Google Drive</title><link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">');
        // Embed the current site seamlessly
        doc.write('<body style="margin:0;padding:0;overflow:hidden;"><iframe src="' + window.location.href + '" style="width:100%;height:100%;border:none;"></iframe></body>');
        doc.close();
        // Redirect the original tab to something innocent
        window.location.replace('https://classroom.google.com'); 
    }

    // Custom Warp Speed Canvas Background (No External Dependencies)
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let stars = [];
    for(let i=0; i<400; i++) {
        stars.push({
            x: Math.random() * canvas.width - canvas.width/2,
            y: Math.random() * canvas.height - canvas.height/2,
            z: Math.random() * 2000
        });
    }

    function animateStars() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // Creates motion blur trail
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.translate(canvas.width/2, canvas.height/2);
        for(let i=0; i<stars.length; i++) {
            let star = stars[i];
            star.z -= 10; // Speed of warp
            if(star.z <= 0) {
                star.z = 2000;
                star.x = Math.random() * canvas.width - canvas.width/2;
                star.y = Math.random() * canvas.height - canvas.height/2;
            }
            let x = (star.x / star.z) * 1000;
            let y = (star.y / star.z) * 1000;
            let size = (1 - star.z / 2000) * 3;
            
            ctx.fillStyle = '#00ffcc';
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.translate(-canvas.width/2, -canvas.height/2);
        requestAnimationFrame(animateStars);
    }
    animateStars();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
